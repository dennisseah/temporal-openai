[project]
name = "temporal-openai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.0",
    "async-openai>=0.0.52",
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "jinja2>=3.1.6",
    "openai>=2.41.0",
    "pydantic-settings>=2.14.1",
    "temporalio>=1.28.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.16",
]


[tool.ruff]
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "TID"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["**/typings", ".venv", ".vscode", ".git", "**/__pycache__", "**/.pytest_cache", "**/.ruff_cache", "**/build", "**/dist", "**/vendor"]
